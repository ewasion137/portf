<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWASION137 // EQUANT OS (x86_64 LIVE)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <span class="led" id="statusLed"></span>
            <span class="brand">EWASION137 // EQUANT_OS</span>
            <span class="status" id="vmStatus">INITIALIZING...</span>
        </div>

        <div class="topbar-right">
            <a href="https://github.com/ewasion137" target="_blank" rel="noopener" class="bar-btn">GITHUB</a>
            <a href="https://github.com/Equinox-Collective/EquantOS" target="_blank" rel="noopener" class="bar-btn">SOURCE</a>
            <a href="mailto:addntim@gmail.com" class="bar-btn">EMAIL</a>
            <span class="sep"></span>
            <button type="button" class="bar-btn" id="btnReboot">REBOOT</button>
            <button type="button" class="bar-btn bar-btn-primary" id="btnFullscreen">FULLSCREEN</button>
        </div>
    </header>

    <main class="monitor-frame" id="monitorFrame" tabindex="0">
        <!-- Важно: внутри screen_container должны быть только div (текст) и canvas (графика) -->
        <div id="screen_container">
            <div class="vga-text" style="white-space: pre; font: 14px monospace; line-height: 14px;"></div>
            <canvas class="vga-canvas" style="display: none;"></canvas>
        </div>

        <div class="boot-overlay" id="bootOverlay">
            <div class="boot-box">
                <div class="boot-title">BOOTING EQUANT_OS (x86_64)...</div>
                <div class="boot-sub" id="bootDetail">Loading WebAssembly JIT &amp; ISO9660 image...</div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
